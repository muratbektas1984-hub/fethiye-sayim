<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kutay Fethiye - Barkod Sayım</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @keyframes blinkRed {
      0%, 100% { background-color: #7f1d1d; color: #fecaca; }
      50% { background-color: #ef4444; color: #ffffff; }
    }
    .blink-alert {
      animation: blinkRed 0.9s infinite;
    }
  </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen antialiased">

  <!-- Üst Header -->
  <header class="bg-[#0b1220] border-b border-slate-800/90 px-4 py-3 sticky top-0 z-30">
    <div class="max-w-md mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shrink-0 shadow-md shadow-blue-950/60">
          <svg class="w-5 h-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M4 6v12M8 6v12M12 6v12M16 6v12M20 6v12" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="min-w-0">
          <div class="flex items-center gap-2">
            <h1 class="text-base font-bold text-white truncate">Kutay Fethiye - Barkod Sayım</h1>
            <button type="button" onclick="openOperatorModal()" title="Sayım Yapan Kişi"
              class="text-[11px] px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 shrink-0">
              <span id="operatorBadge">Kişi</span>
            </button>
          </div>
          <p id="sessionStateLabel" class="text-xs text-amber-400 truncate">
            Sayım oturumu bekleniyor...
          </p>
        </div>
      </div>

      <div id="dbStatusBadge" onclick="pullState(true, false)" title="Durumu yenile"
        class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-700/60 text-emerald-400 text-xs font-semibold shrink-0 cursor-pointer">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="dbBadgeText">Bağlı</span>
      </div>
    </div>
  </header>

  <!-- Personel Adı Modalı -->
  <div id="operatorModal" class="fixed inset-0 bg-black/75 hidden items-center justify-center z-50 p-4">
    <div class="bg-[#0f172a] border border-slate-700 rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <h2 class="text-base font-bold text-white mb-1">Sayım Yapan Kişi</h2>
      <p class="text-xs text-slate-400 mb-4">Okutulan parçaların yanına adınız kaydedilir.</p>
      <input id="operatorInput" type="text" placeholder="Ad Soyad"
        onkeydown="if(event.key==='Enter') saveOperator()"
        class="w-full bg-[#090e1a] border border-slate-700 text-white rounded-xl px-3.5 py-2.5 text-sm mb-4 focus:outline-none focus:border-blue-500" />
      <button type="button" onclick="saveOperator()"
        class="w-full bg-blue-600 hover:bg-blue-500 text-white text-sm font-bold py-2.5 rounded-xl transition">
        Kaydet
      </button>
    </div>
  </div>

  <!-- Uyarı / Bildirim Bannerı -->
  <div id="alertBanner" class="hidden max-w-md mx-auto px-3 pt-3">
    <div id="alertInner" class="px-3.5 py-2.5 rounded-xl border text-xs font-semibold flex items-center justify-between gap-2">
      <span id="alertText"></span>
      <button type="button" onclick="hideAlert()" class="underline shrink-0">Kapat</button>
    </div>
  </div>

  <main class="max-w-md mx-auto p-3 space-y-3">

    <!-- Kamera / Barkod Kutusu -->
    <section class="bg-[#0d1424] border border-slate-800/90 rounded-2xl overflow-hidden">
      <div class="relative min-h-[260px] flex flex-col items-center justify-center bg-[#0b111e]">
        <div id="qr-reader" class="w-full hidden"></div>

        <div id="cameraPlaceholder" class="flex flex-col items-center justify-center text-center px-6 py-10">
          <div class="text-blue-500 mb-3">
            <svg class="w-9 h-9 mx-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M4 6v12M8 6v12M12 6v12M16 6v12M20 6v12" stroke-linecap="round"/>
            </svg>
          </div>
          <p class="text-sm text-slate-400 font-medium">
            Barkod okutmak için "Barkod Oku" butonuna basın.
          </p>
        </div>
      </div>

      <div class="bg-[#0a0f1b] border-t border-slate-800/80 px-4 py-2.5 flex items-center justify-between text-xs">
        <span id="cameraStateText" class="text-slate-400 font-medium">Hazır</span>
        <button type="button" onclick="stopScanner()"
          class="inline-flex items-center gap-1.5 text-rose-400 hover:text-rose-300 font-semibold">
          <span class="w-2 h-2 rounded-[2px] bg-rose-500 inline-block"></span>
          <span>Kapat</span>
        </button>
      </div>
    </section>

    <!-- Barkod Oku Butonu -->
    <button id="btnScanToggle" type="button" onclick="toggleScanner()"
      class="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.99] text-white font-bold text-base py-3.5 rounded-2xl shadow-lg shadow-blue-950/50 flex items-center justify-center gap-2.5 transition">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3">
        <path d="M4 6v12M8 6v12M12 6v12M16 6v12M20 6v12" stroke-linecap="round"/>
      </svg>
      <span id="btnScanText">Barkod Oku</span>
    </button>

    <!-- Parça No Kartı -->
    <section class="bg-[#0d1424] border border-slate-800/90 rounded-2xl p-3.5 space-y-2">
      <div class="flex items-center justify-between gap-2">
        <label for="scanPartInput" class="text-sm font-semibold text-slate-200">Parça No</label>
        <span id="matchBadge" class="text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-slate-800/90 text-slate-400 border border-slate-700/70">
          Eşleşme bekleniyor
        </span>
      </div>
      <input id="scanPartInput" type="text"
        placeholder="BARKOD OKUTUN VEYA PARÇA NO GİRİN"
        oninput="updateMatchStatus()"
        onkeydown="if(event.key==='Enter') recordCount()"
        class="w-full bg-[#090e19] border border-slate-800 focus:border-blue-500 rounded-xl px-3.5 py-3 text-sm font-mono font-semibold text-white placeholder-slate-500 uppercase focus:outline-none" />
      <p id="partNamePreview" class="text-xs text-slate-400 hidden px-0.5"></p>
    </section>

    <!-- Adet Kartı -->
    <section class="bg-[#0d1424] border border-slate-800/90 rounded-2xl p-3.5 space-y-2">
      <label for="scanQtyInput" class="block text-sm font-semibold text-slate-200">Adet</label>
      <input id="scanQtyInput" type="number" min="1" step="1" value="1"
        onkeydown="if(event.key==='Enter') recordCount()"
        class="w-full bg-[#090e19] border border-slate-800 focus:border-blue-500 rounded-xl px-3.5 py-3 text-base font-bold text-white focus:outline-none" />
    </section>

    <!-- + Ekle Butonu -->
    <button id="btnAddPart" type="button" onclick="recordCount()"
      class="w-full bg-[#10b981] hover:bg-[#059669] disabled:opacity-45 disabled:cursor-not-allowed active:scale-[0.99] text-white font-bold text-base py-3.5 rounded-2xl shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 transition">
      <span class="w-5 h-5 rounded-full border-2 border-white inline-flex items-center justify-center text-xs leading-none font-extrabold">+</span>
      <span>Ekle</span>
    </button>

    <!-- Okutulan Parçalar Bölümü -->
    <section class="bg-[#0d1424] border border-slate-800/90 rounded-2xl overflow-hidden">
      <div class="px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2 text-xs font-bold tracking-wider uppercase text-slate-200">
          <span class="text-emerald-400">☰</span>
          <span>OKUTULAN PARCALAR</span>
        </div>
        <span id="totalCountedPill" class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-800 text-slate-300 border border-slate-700/70">
          0 Adet
        </span>
      </div>

      <div id="countedListContainer" class="border-t border-slate-800/80 divide-y divide-slate-800/60 max-h-60 overflow-y-auto">
        <div class="py-5 text-center text-xs text-slate-500">Henüz okutulan parça yok.</div>
      </div>
    </section>

    <!-- Alt Dönem Satırı -->
    <div class="bg-[#0b111e] border border-slate-800/70 rounded-xl px-3.5 py-2 flex items-center justify-between gap-2 text-xs">
      <span class="text-slate-400 font-medium">Dönem:</span>
      <input id="periodInput" type="text" value="DENEME"
        onchange="pullState(false, true)"
        class="bg-transparent text-right font-mono font-bold text-slate-200 uppercase focus:outline-none w-28" />
    </div>

  </main>

  <script>
    const SAYIM_DB_URL = 'https://fethiye-sayim-default-rtdb.europe-west1.firebasedatabase.app';
    const ROOT_COLLECTION = 'kutay_fethiye_sayim';
    const KEY_OPERATOR = 'kutay_fethiye_sayim_kisi_v1';

    let operator = localStorage.getItem(KEY_OPERATOR) || '';
    let pollTimer = null;
    let qrScanner = null;
    let isScanning = false;

    let state = {
      status: 'idle',
      expectedParts: {},
      scannedParts: {}
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderOperator();
      if (!operator) openOperatorModal();
      pullState(false, true);
      pollTimer = setInterval(() => pullState(false, true), 2000);
    });

    function cleanDbUrl(raw) {
      let u = (raw || '').trim().replace(/\/+$/, '');
      if (u.endsWith('.json')) u = u.slice(0, -5);
      return u;
    }

    function normalizePart(raw, fromScanner = false) {
      let code = (raw || '')
        .toString()
        .replace(/[\r\n\t]+/g, ' ')
        .trim()
        .toUpperCase();

      if (!code) return '';
      code = code.replace(/[\s\-]+1$/, '').trim();

      const expectedKeys = Object.keys(state.expectedParts || {});
      if (code.length > 6 && code.endsWith('1')) {
        const withoutTrailingOne = code.slice(0, -1);
        if (expectedKeys.includes(withoutTrailingOne) && !expectedKeys.includes(code)) {
          code = withoutTrailingOne;
        } else if (fromScanner && /^[A-Z0-9]{7,}[A-Z]1$/.test(code)) {
          code = withoutTrailingOne;
        }
      }
      return code;
    }

    function periodKey() {
      const raw = (document.getElementById('periodInput').value || 'DENEME').trim().toUpperCase();
      return raw.replace(/[^A-Z0-9_-]/g, '_') || 'DENEME';
    }

    function sessionEndpoint() {
      return `${cleanDbUrl(SAYIM_DB_URL)}/${ROOT_COLLECTION}/${periodKey()}.json`;
    }

    function partEndpoint(partNo) {
      return `${cleanDbUrl(SAYIM_DB_URL)}/${ROOT_COLLECTION}/${periodKey()}/scannedParts/${encodeURIComponent(normalizePart(partNo))}.json`;
    }

    function openOperatorModal() {
      document.getElementById('operatorInput').value = operator || '';
      const m = document.getElementById('operatorModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function saveOperator() {
      const v = document.getElementById('operatorInput').value.trim();
      if (!v) return alert('Lütfen ad soyad girin.');
      operator = v;
      localStorage.setItem(KEY_OPERATOR, operator);
      renderOperator();
      const m = document.getElementById('operatorModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function renderOperator() {
      document.getElementById('operatorBadge').textContent = operator || 'Kişi';
    }

    function showAlert(msg, type = 'info') {
      const box = document.getElementById('alertBanner');
      const inner = document.getElementById('alertInner');
      document.getElementById('alertText').textContent = msg;
      inner.className = 'px-3.5 py-2.5 rounded-xl border text-xs font-semibold flex items-center justify-between gap-2 ';
      if (type === 'error') inner.className += 'blink-alert border-red-500';
      else if (type === 'success') inner.className += 'bg-emerald-950 text-emerald-300 border-emerald-700';
      else inner.className += 'bg-amber-950 text-amber-300 border-amber-700';
      box.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('alertBanner').classList.add('hidden');
    }

    async function pullState(notify, silent) {
      const badge = document.getElementById('dbStatusBadge');
      const badgeText = document.getElementById('dbBadgeText');
      try {
        const res = await fetch(sessionEndpoint(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-950/80 border border-emerald-700/60 text-emerald-400 text-xs font-semibold shrink-0 cursor-pointer';
        badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>Bağlı</span>';

        state = {
          status: (data && data.status) || 'idle',
          expectedParts: (data && data.expectedParts) || {},
          scannedParts: (data && data.scannedParts) || {}
        };

        refreshStateUI();
        if (notify) showAlert(`Dönem güncellendi: ${periodKey()}`, 'success');
        return true;
      } catch (e) {
        badge.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-rose-950/80 border border-rose-700/60 text-rose-400 text-xs font-semibold shrink-0 cursor-pointer';
        badge.innerHTML = '<span class="w-2 h-2 rounded-full bg-rose-400"></span><span>Kopuk</span>';
        if (!silent) showAlert(`Bağlantı hatası: ${e.message}`, 'error');
        return false;
      }
    }

    function refreshStateUI() {
      const isActive = state.status === 'active';
      const lbl = document.getElementById('sessionStateLabel');

      if (state.status === 'active') {
        lbl.textContent = `Aktif sayım: ${periodKey()} — Okutma yapabilirsiniz`;
        lbl.className = 'text-xs text-emerald-400 truncate';
      } else if (state.status === 'finished') {
        lbl.textContent = `Sayım tamamlandı (${periodKey()})`;
        lbl.className = 'text-xs text-rose-400 truncate';
      } else {
        lbl.textContent = 'Bilgisayardan "Sayımı Başlat" bekleniyor';
        lbl.className = 'text-xs text-amber-400 truncate';
      }

      document.getElementById('btnAddPart').disabled = !isActive;
      updateMatchStatus();
      renderCountedList();
    }

    function updateMatchStatus() {
      const partNo = normalizePart(document.getElementById('scanPartInput').value, false);
      const badge = document.getElementById('matchBadge');
      const preview = document.getElementById('partNamePreview');

      if (!partNo) {
        badge.textContent = 'Eşleşme bekleniyor';
        badge.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-slate-800/90 text-slate-400 border border-slate-700/70';
        preview.classList.add('hidden');
        return;
      }

      const already = state.scannedParts && state.scannedParts[partNo];
      const expected = state.expectedParts && state.expectedParts[partNo];

      if (already) {
        badge.textContent = `Zaten okutuldu (${already.countedQty})`;
        badge.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-rose-950 text-rose-300 border border-rose-800';
      } else if (expected) {
        badge.textContent = `Listede var (Beklenen: ${expected.expectedQty})`;
        badge.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-emerald-950 text-emerald-300 border border-emerald-800';
      } else {
        badge.textContent = 'Listede yok';
        badge.className = 'text-[11px] font-semibold px-2.5 py-0.5 rounded-md bg-amber-950 text-amber-300 border border-amber-800';
      }

      if (expected && expected.name) {
        preview.textContent = expected.name;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }
    }

    async function recordCount() {
      if (!operator) return openOperatorModal();
      if (state.status !== 'active') {
        return showAlert('Sayım henüz başlatılmadı! Bilgisayardan "Sayımı Başlat" butonuna basın.', 'warn');
      }

      const partNo = normalizePart(document.getElementById('scanPartInput').value, true);
      document.getElementById('scanPartInput').value = partNo;
      const qty = parseInt(document.getElementById('scanQtyInput').value, 10);

      if (!partNo) return showAlert('Barkod okutun veya parça no girin.', 'warn');
      if (!qty || qty <= 0) return showAlert('Geçerli bir adet girin.', 'warn');

      await pullState(false, false);
      const existing = state.scannedParts && state.scannedParts[partNo];
      if (existing) {
        showAlert(`UYARI: "${partNo}" daha önce ${existing.by} tarafından (${existing.countedQty} adet) okutulmuş! Tekrar okutulamaz.`, 'error');
        document.getElementById('scanPartInput').select();
        return;
      }

      const checkRes = await fetch(partEndpoint(partNo), { cache: 'no-store' });
      const serverExisting = await checkRes.json();
      if (serverExisting) {
        showAlert(`UYARI: "${partNo}" az önce ${serverExisting.by} tarafından (${serverExisting.countedQty} adet) kaydedilmiş! Tekrar okutulamaz.`, 'error');
        await pullState(false, false);
        return;
      }

      await fetch(partEndpoint(partNo), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          partNo,
          countedQty: qty,
          by: operator,
          time: new Date().toISOString()
        })
      });

      document.getElementById('scanPartInput').value = '';
      document.getElementById('scanQtyInput').value = '1';
      updateMatchStatus();
      document.getElementById('scanPartInput').focus();

      await pullState(false, false);
      showAlert(`"${partNo}" (${qty} adet) eklendi.`, 'success');
    }

    function renderCountedList() {
      const container = document.getElementById('countedListContainer');
      const list = Object.values(state.scannedParts || {}).sort((a, b) => (b.time || '').localeCompare(a.time || ''));
      const totalQty = list.reduce((sum, item) => sum + Number(item.countedQty || 0), 0);

      document.getElementById('totalCountedPill').textContent = `${totalQty} Adet`;

      if (list.length === 0) {
        container.innerHTML = '<div class="py-5 text-center text-xs text-slate-500">Henüz okutulan parça yok.</div>';
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="px-4 py-2.5 flex items-center justify-between gap-2 text-xs">
          <div class="min-w-0">
            <div class="font-mono font-bold text-white truncate">${item.partNo}</div>
            <div class="text-[11px] text-slate-400 truncate">${item.by || '-'}</div>
          </div>
          <span class="px-2.5 py-1 rounded-lg bg-emerald-950 text-emerald-300 border border-emerald-800 font-bold shrink-0">
            ${item.countedQty} Adet
          </span>
        </div>
      `).join('');
    }

    async function toggleScanner() {
      if (isScanning) {
        await stopScanner();
      } else {
        await startScanner();
      }
    }

    async function startScanner() {
      if (isScanning) return;

      document.getElementById('cameraPlaceholder').classList.add('hidden');
      document.getElementById('qr-reader').classList.remove('hidden');
      document.getElementById('cameraStateText').textContent = 'Kamera açılıyor...';
      document.getElementById('btnScanText').textContent = 'Durdur';

      qrScanner = new Html5Qrcode('qr-reader');
      try {
        await qrScanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 220, height: 130 } },
          async (decoded) => {
            const clean = normalizePart(decoded, true);
            document.getElementById('scanPartInput').value = clean;
            await pullState(false, false);
            const existing = state.scannedParts && state.scannedParts[clean];
            if (existing) {
              showAlert(`UYARI: "${clean}" daha önce ${existing.by} tarafından (${existing.countedQty} adet) okutulmuş! Tekrar okutulamaz.`, 'error');
              document.getElementById('scanPartInput').value = '';
              updateMatchStatus();
            } else {
              updateMatchStatus();
              document.getElementById('scanQtyInput').focus();
            }
          },
          () => {}
        );
        isScanning = true;
        document.getElementById('cameraStateText').textContent = 'Kamera aktif';
      } catch (e) {
        showAlert('Kamera açılamadı. HTTPS ve kamera iznini kontrol edin.', 'warn');
        await stopScanner();
      }
    }

    async function stopScanner() {
      if (qrScanner) {
        try {
          if (isScanning) await qrScanner.stop();
          qrScanner.clear();
        } catch (_) {}
      }
      qrScanner = null;
      isScanning = false;
      document.getElementById('qr-reader').classList.add('hidden');
      document.getElementById('cameraPlaceholder').classList.remove('hidden');
      document.getElementById('cameraStateText').textContent = 'Hazır';
      document.getElementById('btnScanText').textContent = 'Barkod Oku';
    }
  </script>
</body>
</html>
