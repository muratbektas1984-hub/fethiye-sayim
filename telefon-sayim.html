<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kutay Fethiye Sayım — Telefon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @keyframes blinkRed {
      0%, 100% { background-color: #fee2e2; color: #991b1b; }
      50% { background-color: #ef4444; color: #ffffff; }
    }
    .blink-alert {
      animation: blinkRed 0.9s infinite;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <header class="bg-slate-900 text-white px-4 py-3 shadow flex items-center justify-between gap-2">
    <div>
      <h1 class="text-base font-bold tracking-wide uppercase">Kutay Fethiye Sayım</h1>
      <p id="sessionStateLabel" class="text-xs text-amber-300">Bilgisayardan "Sayımı Başlat" bekleniyor</p>
    </div>
    <div class="flex items-center gap-2 text-xs">
      <span id="operatorBadge" class="px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 font-semibold">
        -
      </span>
      <button type="button" onclick="openOperatorModal()" class="bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded font-semibold">
        Ad
      </button>
    </div>
  </header>

  <div id="operatorModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-xl">
      <h2 class="text-base font-bold mb-2">Sayım Yapan Kişi</h2>
      <p class="text-xs text-slate-600 mb-4">Okuttuğunuz parçalara adınız kaydedilir.</p>
      <input id="operatorInput" type="text" placeholder="Ad Soyad"
        onkeydown="if(event.key==='Enter') saveOperator()"
        class="w-full border rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-blue-600" />
      <button type="button" onclick="saveOperator()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold py-2 rounded-lg">
        Kaydet
      </button>
    </div>
  </div>

  <div id="alertBanner" class="hidden max-w-xl mx-auto mt-3 px-4">
    <div id="alertInner" class="px-4 py-3 rounded-xl border text-sm font-semibold flex items-center justify-between shadow">
      <span id="alertText"></span>
      <button type="button" onclick="hideAlert()" class="text-xs underline ml-3">Kapat</button>
    </div>
  </div>

  <main class="max-w-xl mx-auto p-4 space-y-4">

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-700 uppercase">Sayım Dönemi</label>
        <span id="dbBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 font-semibold">
          Bağlanıyor...
        </span>
      </div>
      <div class="flex gap-2">
        <input id="periodInput" type="text" value="DENEME"
          onchange="pullState(false, true)"
          class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono uppercase focus:outline-none focus:ring-2 focus:ring-blue-600" />
        <button type="button" onclick="pullState(true, false)"
          class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-xl">
          Yenile
        </button>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h2 class="font-bold text-sm">Kamera ile Parça Okut</h2>
        <span id="countedCountBadge" class="text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200 px-2.5 py-0.5 rounded-full">
          Okutulan: 0
        </span>
      </div>

      <div id="qr-reader" class="w-full rounded-xl overflow-hidden bg-slate-900 min-h-[210px]"></div>

      <div class="flex gap-2">
        <button type="button" onclick="startScanner()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl">
          Kamerayı Aç
        </button>
        <button type="button" onclick="stopScanner()" class="flex-1 bg-slate-600 hover:bg-slate-700 text-white text-xs font-bold py-2.5 rounded-xl">
          Kamerayı Kapat
        </button>
      </div>

      <div class="space-y-3 pt-1">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Parça Numarası</label>
          <input id="scanPartInput" type="text" placeholder="Okutun veya yazın"
            onkeydown="if(event.key==='Enter') recordCount()"
            class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-base font-mono uppercase focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">Okutulan Adet</label>
          <input id="scanQtyInput" type="number" min="1" step="1" value="1"
            onkeydown="if(event.key==='Enter') recordCount()"
            class="w-full border border-slate-300 rounded-xl px-3 py-2.5 text-base font-bold focus:outline-none focus:ring-2 focus:ring-blue-600" />
        </div>

        <button id="btnSaveScan" type="button" onclick="recordCount()" disabled
          class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl shadow-sm">
          Kaydet
        </button>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 space-y-2">
      <h2 class="font-bold text-sm">Okutulan Parçalar</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="border-b bg-slate-50 text-slate-500 uppercase">
              <th class="py-2 px-2">Parça No</th>
              <th class="py-2 px-2 text-right">Adet</th>
              <th class="py-2 px-2">Kişi</th>
            </tr>
          </thead>
          <tbody id="countedBody" class="divide-y">
            <tr><td colspan="3" class="py-4 text-center text-slate-400">Henüz kayıt yok.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    const SAYIM_DB_URL = 'https://fethiye-sayim-default-rtdb.europe-west1.firebasedatabase.app';
    const ROOT_COLLECTION = 'kutay_fethiye_sayim';
    const KEY_OPERATOR = 'kutay_fethiye_sayim_kisi_v1';

    let operator = localStorage.getItem(KEY_OPERATOR) || '';
    let pollTimer = null;
    let qrScanner = null;

    let state = {
      status: 'idle',
      expectedParts: {},
      scannedParts: {}
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderOperator();
      if (!operator) openOperatorModal();
      pullState(false, true);
      pollTimer = setInterval(() => pullState(false, true), 2000);
    });

    function cleanDbUrl(raw) {
      let u = (raw || '').trim().replace(/\/+$/, '');
      if (u.endsWith('.json')) u = u.slice(0, -5);
      return u;
    }

    function normalizePart(raw, fromScanner = false) {
      let code = (raw || '')
        .toString()
        .replace(/[\r\n\t]+/g, ' ')
        .trim()
        .toUpperCase();

      if (!code) return '';

      code = code.replace(/[\s\-]+1$/, '').trim();

      const expectedKeys = Object.keys(state.expectedParts || {});
      if (code.length > 6 && code.endsWith('1')) {
        const withoutTrailingOne = code.slice(0, -1);
        if (expectedKeys.includes(withoutTrailingOne) && !expectedKeys.includes(code)) {
          code = withoutTrailingOne;
        } else if (fromScanner && /^[A-Z0-9]{7,}[A-Z]1$/.test(code)) {
          code = withoutTrailingOne;
        }
      }

      return code;
    }

    function periodKey() {
      const raw = (document.getElementById('periodInput').value || 'DENEME').trim().toUpperCase();
      return raw.replace(/[^A-Z0-9_-]/g, '_') || 'DENEME';
    }

    function sessionEndpoint() {
      return `${cleanDbUrl(SAYIM_DB_URL)}/${ROOT_COLLECTION}/${periodKey()}.json`;
    }

    function partEndpoint(partNo) {
      return `${cleanDbUrl(SAYIM_DB_URL)}/${ROOT_COLLECTION}/${periodKey()}/scannedParts/${encodeURIComponent(normalizePart(partNo))}.json`;
    }

    function openOperatorModal() {
      document.getElementById('operatorInput').value = operator || '';
      const m = document.getElementById('operatorModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    }

    function saveOperator() {
      const v = document.getElementById('operatorInput').value.trim();
      if (!v) return alert('Lütfen ad soyad girin.');
      operator = v;
      localStorage.setItem(KEY_OPERATOR, operator);
      renderOperator();
      const m = document.getElementById('operatorModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function renderOperator() {
      document.getElementById('operatorBadge').textContent = operator || '-';
    }

    function showAlert(msg, type = 'info') {
      const box = document.getElementById('alertBanner');
      const inner = document.getElementById('alertInner');
      document.getElementById('alertText').textContent = msg;
      inner.className = 'px-4 py-3 rounded-xl border text-sm font-semibold flex items-center justify-between shadow ';
      if (type === 'error') inner.className += 'blink-alert border-red-400';
      else if (type === 'success') inner.className += 'bg-emerald-100 text-emerald-900 border-emerald-300';
      else inner.className += 'bg-amber-100 text-amber-900 border-amber-300';
      box.classList.remove('hidden');
    }

    function hideAlert() {
      document.getElementById('alertBanner').classList.add('hidden');
    }

    async function pullState(notify, silent) {
      try {
        const res = await fetch(sessionEndpoint(), { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        const b = document.getElementById('dbBadge');
        b.textContent = 'Canlı Bağlı';
        b.className = 'text-xs px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-semibold';

        state = {
          status: (data && data.status) || 'idle',
          expectedParts: (data && data.expectedParts) || {},
          scannedParts: (data && data.scannedParts) || {}
        };

        refreshStateUI();
        if (notify) showAlert(`Dönem güncellendi: ${periodKey()}`, 'success'); return true; } catch (e) { const b = document.getElementById('dbBadge'); b.textContent = 'Bağlantı Hatası'; b.className = 'text-xs px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-800 font-semibold'; if (!silent) showAlert(`Bağlantı hatası: ${e.message}`, 'error');
        return false;
      }
    }

    function refreshStateUI() {
      const isActive = state.status === 'active';
      const lbl = document.getElementById('sessionStateLabel');

      if (state.status === 'active') {
        lbl.textContent = `SAYIM AKTİF (${periodKey()}) — Okutma yapabilirsiniz`;
        lbl.className = 'text-xs text-emerald-300 font-semibold';
      } else if (state.status === 'finished') {
        lbl.textContent = `Sayım tamamlandı (${periodKey()})`;
        lbl.className = 'text-xs text-rose-300 font-semibold';
      } else {
        lbl.textContent = 'Bilgisayardan "Sayımı Başlat" bekleniyor';
        lbl.className = 'text-xs text-amber-300';
      }

      document.getElementById('btnSaveScan').disabled = !isActive;
      document.getElementById('countedCountBadge').textContent = `Okutulan: ${Object.keys(state.scannedParts \vert{}\vert{} {}).length}`; renderCountedList(); }  async function recordCount() { if (!operator) return openOperatorModal(); if (state.status !== 'active') return showAlert('Sayım henüz başlatılmadı! Bilgisayardan "Sayımı Başlat" butonuna basın.', 'warn');  const partNo = normalizePart(document.getElementById('scanPartInput').value, true); document.getElementById('scanPartInput').value = partNo; const qty = parseInt(document.getElementById('scanQtyInput').value, 10);  if (!partNo) return showAlert('Parça numarası okutun veya girin.', 'warn'); if (!qty \vert{}\vert{} qty <= 0) return showAlert('Geçerli bir adet girin.', 'warn');  await pullState(false, false); const existing = state.scannedParts && state.scannedParts[partNo]; if (existing) { showAlert(`UYARI: "${partNo}" daha önce ${existing.by} tarafından (${existing.countedQty} adet) okutulmuş! Tekrar okutulamaz.`, 'error');
        document.getElementById('scanPartInput').select();
        return;
      }

      const checkRes = await fetch(partEndpoint(partNo), { cache: 'no-store' });
      const serverExisting = await checkRes.json();
      if (serverExisting) {
        showAlert(`UYARI: "${partNo}" az önce ${serverExisting.by} tarafından (${serverExisting.countedQty} adet) kaydedilmiş! Tekrar okutulamaz.`, 'error');
        await pullState(false, false);
        return;
      }

      await fetch(partEndpoint(partNo), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          partNo,
          countedQty: qty,
          by: operator,
          time: new Date().toISOString()
        })
      });

      document.getElementById('scanPartInput').value = '';
      document.getElementById('scanQtyInput').value = '1';
      document.getElementById('scanPartInput').focus();

      await pullState(false, false);
      showAlert(`"${partNo}" (${qty} adet) kaydedildi.`, 'success');
    }

    function renderCountedList() {
      const tbody = document.getElementById('countedBody');
      const list = Object.values(state.scannedParts || {}).sort((a, b) => (b.time || '').localeCompare(a.time || ''));
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="py-4 text-center text-slate-400">Henüz kayıt yok.</td></tr>';
        return;
      }
      tbody.innerHTML = list.map(item => `
        <tr>
          <td class="py-2 px-2 font-mono font-bold">${item.partNo}</td>
          <td class="py-2 px-2 text-right font-bold text-emerald-700">${item.countedQty}</td>
          <td class="py
